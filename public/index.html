<!doctype html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/Vanta-git/Two-Jet@main/public/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>two jet</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-panel: #111111;
      --bg-hover: #1e1e1e;
      --bg-input: #141414;
      --bg-modal: #161616;
      --border-color: #2a2a2a;
      --text-main: #f0f0f0;
      --text-muted: #888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      height: 100%; 
      background: var(--bg-base); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .title-bar {
      display: flex; align-items: flex-end; background: var(--bg-base);
      padding: 8px 12px 0 12px; height: 44px; gap: 4px;
    }
    .tabs-container {
      display: flex; overflow-x: auto; scrollbar-width: none; gap: 4px; flex: 1;
    }
    .tabs-container::-webkit-scrollbar { display: none; }
    
    .tab {
      display: flex; align-items: center; background: var(--bg-panel);
      padding: 8px 12px; border-radius: 8px 8px 0 0; font-size: 12px;
      color: var(--text-muted); width: 180px; min-width: 120px;
      justify-content: space-between; border: 1px solid transparent; border-bottom: none;
      cursor: pointer; user-select: none;
    }
    .tab.active { background: var(--bg-hover); color: var(--text-main); border-color: var(--border-color); }
    .tab:hover:not(.active) { background: #181818; }
    .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 8px; font-family: sans-serif;}
    .close-tab { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .close-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .close-tab svg { width: 10px; height: 10px; fill: currentColor; }

    .new-tab-btn {
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 6px; color: var(--text-muted); margin-bottom: 2px;
      flex-shrink: 0;
    }
    .new-tab-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .new-tab-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .nav-bar {
      display: flex; align-items: center; background: var(--bg-panel); padding: 8px 16px; gap: 12px;
      border-bottom: 1px solid var(--border-color); z-index: 20; position: relative;
    }
    .nav-btn {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px;
    }
    .nav-btn:hover { background: var(--bg-hover); color: #fff; }
    .nav-btn svg { width: 16px; height: 16px; fill: currentColor; }
    
    .url-container {
      flex: 1; display: flex; align-items: center; background: var(--bg-input);
      border: 1px solid var(--border-color); border-radius: 20px; padding: 0 16px; height: 34px;
    }
    .url-container input {
      flex: 1; background: none; border: none; color: var(--text-main); font-size: 13px; outline: none; font-family: sans-serif;
    }

    .view-container { position: relative; height: calc(100% - 95px); width: 100%; background: var(--bg-base); }
    
    .iframe-layer { 
      position: absolute; inset: 0; width: 100%; height: 100%; border: none; 
      background: #fff; visibility: hidden; opacity: 0; z-index: 1; 
    }
    .iframe-layer.active { visibility: visible; opacity: 1; z-index: 5; }

    #start-page { 
      position: absolute; inset: 0; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; overflow: hidden;
      visibility: hidden; opacity: 0; z-index: 1; transition: opacity 0.2s;
    }
    #start-page.active { visibility: visible; opacity: 1; z-index: 10; }

    .home-content {
      position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%;
    }
    
    .vanta-title {
      height: 100px;
      max-width: 90vw;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .vanta-date {
      font-size: 14px; color: var(--text-muted); margin-bottom: 40px;
    }
    
    .search-box {
      display: flex; align-items: center; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px);
      border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 16px; width: 500px; margin-bottom: 40px;
      max-width: 90vw;
    }
    .search-box svg { width: 16px; height: 16px; fill: var(--text-muted); margin-right: 12px; }
    .search-box input {
      flex: 1; background: none; border: none; color: var(--text-main); font-size: 14px; outline: none;
    }
    .search-box select {
      background: var(--bg-hover); color: var(--text-muted); border: none; padding: 4px 8px;
      border-radius: 6px; font-size: 12px; outline: none; cursor: pointer; margin-left: 8px;
    }

    .shortcuts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px 32px; }
    @media (max-width: 600px) {
      .shortcuts { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    .shortcut { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; }
    .shortcut-icon {
      width: 56px; height: 56px; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px);
      border: 1px solid var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .shortcut:hover .shortcut-icon { background: rgba(40, 40, 40, 0.9); border-color: rgba(255,255,255,0.3); }
    .shortcut-icon svg, .shortcut-icon i { width: 24px; height: 24px; fill: var(--text-main); color: var(--text-main); font-size: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold;}
    
    .shortcut-icon img { width: 32px; height: 32px; border-radius: 6px; object-fit: contain; }

    .shortcut-name { font-size: 12px; color: var(--text-muted); text-align: center; max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .delete-shortcut {
      position: absolute; top: -6px; right: -6px; background: #e74c3c; color: #fff;
      border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      z-index: 10; font-weight: bold;
    }
    .shortcut:hover .delete-shortcut { display: flex; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; font-family: sans-serif; }
    .modal { background: var(--bg-modal); width: 420px; max-width: 90vw; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .modal-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 14px; }
    .close-modal { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
    .modal-body { padding: 20px; }
    
    .bookmark-input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px;
      font-size: 13px; outline: none;
    }
    .bookmark-input:focus { border-color: #555; }
    .bookmark-btn {
      width: 100%; background: var(--text-main); color: var(--bg-base); border: none;
      padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .bookmark-btn:hover { background: #fff; }

    .server-option { display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); border: 1px solid #333; padding: 12px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 8px; }
    .server-option:hover { background: var(--bg-hover); }
    .server-option.active { border-color: #777; }
    .server-name { font-size: 13px; font-weight: 500; }
    .server-url { font-size: 11px; color: #666; font-family: monospace; margin-top: 4px; }
    #status-text { position: absolute; bottom: 10px; right: 10px; font-size: 11px; color: #555; pointer-events: none; font-family: sans-serif; z-index: 100;}
    
    #no-servers-error {
      position: fixed; inset: 0; background: var(--bg-base); z-index: 9999;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      font-size: 24px; color: var(--text-main); font-family: 'Fredoka', sans-serif;
    }
    #no-servers-error span { font-size: 80px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div id="no-servers-error">
    <span>😔</span>
    sorry no servers for you
  </div>

  <div class="title-bar">
    <div class="tabs-container" id="tabs-container"></div>
    <div class="new-tab-btn" id="new-tab-btn" title="New Tab"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="back" title="Back"><svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg></button>
    <button class="nav-btn" id="forward" title="Forward"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></button>
    <button class="nav-btn" id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
    <button class="nav-btn" id="home-btn" title="Home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    
    <div class="url-container">
      <input type="text" id="url" placeholder="Search or enter URL">
    </div>
    
    <button class="nav-btn" id="settings-btn" title="Proxy Settings"><svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></button>
  </div>

  <div class="view-container">
    <div id="start-page" class="active">
      <div class="home-content">
        <img src="https://cdn.jsdelivr.net/gh/Vanta-git/Two-Jet@main/two-jet.png" alt="Two-Jet" class="vanta-title">
        <div class="vanta-date" id="date-display"></div>
        
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="main-search" placeholder="Search the web...">
          <select id="search-engine"><option value="brave">Brave</option><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option></select>
        </div>

        <div class="shortcuts" id="shortcuts-container"></div>
      </div>
    </div>
    
    <div id="frames-container"></div>
  </div>
  
  <span id="status-text"></span>

  <div class="modal-overlay" id="proxy-modal">
    <div class="modal">
      <div class="modal-header">Proxy Settings<button class="close-modal" id="close-modal">✕</button></div>
      <div class="modal-body" id="server-list-body"></div>
    </div>
  </div>

  <div class="modal-overlay" id="add-bookmark-modal">
    <div class="modal">
      <div class="modal-header">Add Shortcut<button class="close-modal" id="close-bookmark-modal">✕</button></div>
      <div class="modal-body">
        <input type="text" id="bookmark-name" class="bookmark-input" placeholder="Name (e.g., YouTube)">
        <input type="url" id="bookmark-url" class="bookmark-input" placeholder="URL (e.g., https://youtube.com)">
        <button id="save-bookmark" class="bookmark-btn">Save Shortcut</button>
      </div>
    </div>
  </div>

<script>
lucide.createIcons();

function updateDate() {
  document.getElementById("date-display").textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
updateDate();
setInterval(updateDate, 60000);

const CDN = 'https://cdn.jsdelivr.net/gh/Vanta-git/Two-jet-Storage@main';
const statusEl = document.getElementById("status-text");
let controller = null;
let proxyReady = false;
let activeWispUrl = null;

const wispServers = [
  { name: "Onyx WISP", url: "wss://onyxv1.ai.studio/" },
  { name: "English Revision", url: "wss://wisp.englishrevision.site/" },
  { name: "HTML Project", url: "wss://wisp3.thehtmlproject.com/" }
];

async function testWispServer(wispUrl) {
  try {
    const transportApi = window.EpoxyTransport || (await loadScript("https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"), window.EpoxyTransport);
    const Transport = transportApi?.default || transportApi;
    const transport = new Transport({ wisp: wispUrl });
    await transport.init();
    return true;
  } catch (err) {
    return false;
  }
}

async function autoPickBestWisp() {
  status("Finding best server...");
  for (const server of wispServers) {
    status(`Testing ${server.name}...`);
    const works = await testWispServer(server.url);
    if (works) return server.url;
  }
  return null;
}

function updateServerModalUI(activeUrl) {
  const modalBody = document.getElementById("server-list-body");
  modalBody.innerHTML = "";
  wispServers.forEach(server => {
    const option = document.createElement("div");
    option.className = `server-option ${server.url === activeUrl ? 'active' : ''}`;
    option.innerHTML = `<div><div class="server-name">${server.name}</div><div class="server-url">${server.url}</div></div>`;
    option.onclick = () => {
      document.querySelectorAll(".server-option").forEach(o => o.classList.remove("active"));
      option.classList.add("active");
      document.getElementById("proxy-modal").style.display = 'none';
      initScramjet(server.url);
    };
    modalBody.appendChild(option);
  });
}

function status(t, error=false) { statusEl.textContent = t; statusEl.style.color = error ? "#ff7777" : "#555"; }
function loadScript(src) { return new Promise((r, j) => { const s = document.createElement("script"); s.src = src; s.onload = r; s.onerror = () => j(new Error("Failed: " + src)); document.head.appendChild(s); }); }

async function initScramjet(forcedWisp = null) {
  try {
    status("Loading Proxy...");
    const selectedWisp = forcedWisp || await autoPickBestWisp();
    
    if (!selectedWisp) {
      document.getElementById('no-servers-error').style.display = 'flex';
      status("No servers available.", true);
      return;
    }

    activeWispUrl = selectedWisp;
    updateServerModalUI(selectedWisp);

    await loadScript(CDN + "/scramjet/scramjet.js");
    await loadScript(CDN + "/controller/controller.api.js");
    await navigator.serviceWorker.ready;
    const sw = navigator.serviceWorker.controller || (await navigator.serviceWorker.ready).active;
    const transportApi = window.EpoxyTransport || (await loadScript("https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"), window.EpoxyTransport);
    const Transport = transportApi?.default || transportApi;
    const transport = new Transport({ wisp: selectedWisp });
    await transport.init();

    controller = new window.$scramjetController.Controller({
      serviceworker: sw, transport,
      config: { scramjetPath: CDN + "/scramjet/scramjet.js", wasmPath: CDN + "/scramjet/scramjet.wasm", injectPath: CDN + "/controller/controller.inject.js" },
      scramjetConfig: window.$scramjet.defaultConfig
    });

    await controller.wait();
    proxyReady = true;
    status("");
    
    tabs.forEach(tab => { 
      if(tab.iframe && !tab.frameController) {
        tab.frameController = controller.createFrame(tab.iframe); 
        if (tab.url) tab.frameController.go(tab.url);
      }
    });
  } catch (e) { status("Proxy Error", true); console.error(e); }
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", {scope:"./", updateViaCache:"none"}).then(() => initScramjet()).catch(e => status(e.message, true));
}

const tabsContainer = document.getElementById('tabs-container');
const framesContainer = document.getElementById('frames-container');
const urlInput = document.getElementById('url');
const mainSearch = document.getElementById('main-search');
const searchEngine = document.getElementById('search-engine');
const startPage = document.getElementById('start-page');
let tabs = [];
let activeTabId = null;
let tabCounter = 0;

function saveSession() {
  const sessionData = {
    tabs: tabs.map(t => ({ id: t.id, url: t.url, title: t.title })),
    activeTabId,
    tabCounter
  };
  sessionStorage.setItem('vanta_session', JSON.stringify(sessionData));
}

function extractProxyUrl(rawUrl) {
  if (!rawUrl) return "";
  try {
    const urlObj = new URL(rawUrl);
    const pathAndQuery = urlObj.pathname + urlObj.search + urlObj.hash;
    
    const schemeMatch = pathAndQuery.match(/https?%3A%2F%2F|https?:\/\//i);
    
    if (schemeMatch) {
      let target = pathAndQuery.substring(schemeMatch.index);
      let decoded = decodeURIComponent(target);
      
      decoded = decoded.replace(/[?&]\$io=.*$/, '');
      decoded = decoded.replace(/[?&]\$rfs=.*$/, '');
      
      return decoded;
    }
  } catch (e) {
  }
  return rawUrl;
}

function syncIframeUrl(tab) {
  if (!tab || !tab.iframe) return;
  try {
    const rawHref = tab.iframe.contentWindow.location.href;
    if (rawHref && rawHref !== "about:blank") {
      const realUrl = extractProxyUrl(rawHref);
      if (realUrl && realUrl !== tab.url) {
        tab.url = realUrl;
        if (activeTabId === tab.id) {
          urlInput.value = realUrl;
          updateTabTitle(tab.id, realUrl);
        }
        saveSession();
      }
    }
  } catch (e) {
  }
}

setInterval(() => {
  const activeTab = getActiveTab();
  if (activeTab) syncIframeUrl(activeTab);
}, 1000);

function updateTabTitle(id, url) {
  const tabEl = document.getElementById(`ui-${id}`);
  if (!tabEl) return;
  let title = "New Tab";
  if (url) {
    try { title = new URL(url).hostname.replace('www.', ''); } 
    catch (e) { title = url.replace(/^https?:\/\//, '').split('/')[0]; }
  }
  tabEl.querySelector('.tab-title').textContent = title;
  const tab = tabs.find(t => t.id === id);
  if (tab) tab.title = title;
}

function createTab(initialUrl = '', initialId = null, initialTitle = 'New Tab') {
  const id = initialId || 'tab-' + (++tabCounter);
  const tab = { id, url: initialUrl, title: initialTitle, iframe: null, frameController: null };
  tabs.push(tab);

  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.id = `ui-${id}`;
  tabEl.innerHTML = `<div class="tab-title">${initialTitle}</div><div class="close-tab"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></div>`;
  
  tabEl.addEventListener('click', (e) => { if(!e.target.closest('.close-tab')) switchTab(id); });
  tabEl.querySelector('.close-tab').addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });
  tabsContainer.appendChild(tabEl);

  const iframe = document.createElement('iframe');
  iframe.className = 'iframe-layer';
  iframe.id = `frame-${id}`;
  framesContainer.appendChild(iframe);
  tab.iframe = iframe;

  iframe.addEventListener('load', () => syncIframeUrl(tab));

  if (proxyReady && controller) {
    tab.frameController = controller.createFrame(iframe);
    if (initialUrl) tab.frameController.go(initialUrl);
  } else if (initialUrl) {
    iframe.src = initialUrl;
  }

  switchTab(id);
  saveSession();
  return tab;
}

function switchTab(id) {
  activeTabId = id;
  const tab = tabs.find(t => t.id === id);
  if (!tab) return;

  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(`ui-${id}`).classList.add('active');
  
  document.querySelectorAll('.iframe-layer').forEach(el => el.classList.remove('active'));
  
  urlInput.value = tab.url;

  if (tab.url === '') {
    startPage.classList.add('active');
  } else {
    startPage.classList.remove('active');
    tab.iframe.classList.add('active');
  }
  saveSession();
}

function closeTab(id) {
  const index = tabs.findIndex(t => t.id === id);
  if(index === -1) return;
  
  document.getElementById(`ui-${id}`).remove();
  document.getElementById(`frame-${id}`).remove();
  tabs.splice(index, 1);

  if (tabs.length === 0) {
    createTab();
  } else if (activeTabId === id) {
    switchTab(tabs[Math.max(0, index - 1)].id);
  }
  saveSession();
}

function getActiveTab() { return tabs.find(t => t.id === activeTabId); }

function getSearchUrl(query) {
  const engine = searchEngine.value;
  if (engine === 'google') return "https://www.google.com/search?q=" + encodeURIComponent(query);
  if (engine === 'duckduckgo') return "https://duckduckgo.com/?q=" + encodeURIComponent(query);
  return "https://search.brave.com/search?q=" + encodeURIComponent(query);
}

function navigate(url) {
  if(!url.trim()) return;
  let target = url.trim();
  
  if (!/^https?:\/\//i.test(target) && !target.includes('.')) {
    target = getSearchUrl(target);
  } else if (!/^https?:\/\//i.test(target)) {
    target = "https://" + target;
  }

  const tab = getActiveTab();
  if(!tab) return;
  
  tab.url = target;
  urlInput.value = target;
  mainSearch.value = ""; 
  
  updateTabTitle(tab.id, target);

  startPage.classList.remove('active');
  tab.iframe.classList.add('active');
  
  if (tab.frameController) {
    tab.frameController.go(target);
  } else {
    tab.iframe.src = target;
  }
  saveSession();
}

document.getElementById('new-tab-btn').onclick = () => createTab();
urlInput.addEventListener("keydown", e => { if (e.key === "Enter") navigate(urlInput.value); });
mainSearch.addEventListener("keydown", e => { if (e.key === "Enter") navigate(mainSearch.value); });
document.getElementById("back").onclick = () => { const t = getActiveTab(); if(t && t.frameController) { t.frameController.back(); setTimeout(()=>syncIframeUrl(t), 500); } };
document.getElementById("forward").onclick = () => { const t = getActiveTab(); if(t && t.frameController) { t.frameController.forward(); setTimeout(()=>syncIframeUrl(t), 500); } };
document.getElementById("reload").onclick = () => { const t = getActiveTab(); if(t && t.frameController) { t.frameController.reload(); } else if (t) { t.iframe.src = t.iframe.src; } };
document.getElementById("home-btn").onclick = () => {
  const tab = getActiveTab();
  if(tab) {
    tab.url = ""; urlInput.value = "";
    document.getElementById(`ui-${tab.id}`).querySelector('.tab-title').textContent = "New Tab";
    switchTab(tab.id);
  }
};

const modal = document.getElementById("proxy-modal");
document.getElementById("settings-btn").onclick = () => {
  if (!activeWispUrl) updateServerModalUI(wispServers[0].url);
  modal.style.display = 'flex';
};
document.getElementById("close-modal").onclick = () => modal.style.display = 'none';

const defaultBookmarks = [
  { name: 'YouTube', url: 'https://youtube.com' },
  { name: 'GitHub', url: 'https://github.com' },
  { name: 'Discord', url: 'https://discord.com' },
  { name: 'Twitter', url: 'https://twitter.com' },
  { name: 'Reddit', url: 'https://reddit.com' }
];

let bookmarks = JSON.parse(localStorage.getItem('vanta_bookmarks')) || defaultBookmarks;
const shortcutsContainer = document.getElementById('shortcuts-container');
const bookmarkModal = document.getElementById('add-bookmark-modal');

function saveBookmarks() {
  localStorage.setItem('vanta_bookmarks', JSON.stringify(bookmarks));
  renderBookmarks();
}

window.deleteBookmark = function(event, index) {
  event.stopPropagation();
  bookmarks.splice(index, 1);
  saveBookmarks();
};

function renderBookmarks() {
  shortcutsContainer.innerHTML = '';
  
  bookmarks.forEach((bm, index) => {
    const div = document.createElement('div');
    div.className = 'shortcut';
    div.onclick = () => navigate(bm.url);
    
    let domain = bm.url;
    try { domain = new URL(bm.url).hostname; } catch(e) {}

    div.innerHTML = `
      <button class="delete-shortcut" onclick="deleteBookmark(event, ${index})" title="Delete shortcut">✕</button>
      <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="${bm.name}" onerror="this.outerHTML='<svg width=\\'24\\' height=\\'24\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'2\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/><path d=\\'M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\\'/></svg>'"></div>
      <div class="shortcut-name" title="${bm.name}">${bm.name}</div>
    `;
    shortcutsContainer.appendChild(div);
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'shortcut';
  addBtn.onclick = () => { bookmarkModal.style.display = 'flex'; };
  addBtn.innerHTML = `
    <div class="shortcut-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg></div>
    <div class="shortcut-name">Add</div>
  `;
  shortcutsContainer.appendChild(addBtn);
}

document.getElementById('close-bookmark-modal').onclick = () => { 
  bookmarkModal.style.display = 'none'; 
  document.getElementById('bookmark-name').value = '';
  document.getElementById('bookmark-url').value = '';
};

document.getElementById('save-bookmark').onclick = () => {
  const nameInput = document.getElementById('bookmark-name');
  const urlInput = document.getElementById('bookmark-url');
  let name = nameInput.value.trim();
  let url = urlInput.value.trim();
  
  if (name && url) {
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    bookmarks.push({ name, url });
    saveBookmarks();
    bookmarkModal.style.display = 'none';
    nameInput.value = '';
    urlInput.value = '';
  }
};

renderBookmarks();

const savedSession = sessionStorage.getItem('vanta_session');
if (savedSession) {
  try {
    const data = JSON.parse(savedSession);
    if (data.tabs && data.tabs.length > 0) {
      tabCounter = data.tabCounter || 0;
      data.tabs.forEach(t => createTab(t.url, t.id, t.title));
      if (data.activeTabId) switchTab(data.activeTabId);
    } else {
      createTab();
    }
  } catch (e) {
    createTab();
  }
} else {
  createTab();
}
</script>
</body>
